name: Stemmen inspreken (Maarten)
on:
  push:
    paths: ['stemmen/nieuw.tsv']
  workflow_dispatch:
permissions:
  contents: write
concurrency: stemmen
jobs:
  inspreken:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Ontbrekende teksten inspreken
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: python3 stemmen/maak.py
      - name: Opnames opslaan
        run: |
          git config user.name "stemmen-bot"
          git config user.email "stemmen-bot@users.noreply.github.com"
          git add audio/m2
          git diff --cached --quiet && exit 0
          git commit -m "Nieuwe opnames van Maarten"
          git pull --rebase
          git push
